// ---------------------------------------------------------------------------
// helpers
// ---------------------------------------------------------------------------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOut = (p) => 1 - Math.pow(1 - p, 3);
const eIn = (p) => p * p * p;
const eInOut = (p) => (p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
const eQuint = (p) => (p < .5 ? 16 * p ** 5 : 1 - Math.pow(-2 * p + 2, 5) / 2);
// overshoot pop: 0 → 1.15 → 1.0 over `d` seconds
function pop(t, t0, d = 0.27) {
  const p = clamp((t - t0) / d);
  if (p <= 0) return 0;
  if (p < .55) return 1.15 * eOut(p / .55);
  return lerp(1.15, 1, eInOut((p - .55) / .45));
}
const hash = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const h = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const set = (el, s) => Object.assign(el.style, s);

function keyed(keys, t, n) {               // eased piecewise interpolation of keyframe columns
  if (t <= keys[0][0]) return keys[0].slice(1, n + 1);
  for (let i = 0; i < keys.length - 1; i++) {
    const a = keys[i], b = keys[i + 1];
    if (t <= b[0]) {
      const p = eQuint(seg(t, a[0], b[0]));
      const out = []; for (let k = 1; k <= n; k++) out.push(lerp(a[k], b[k], p));
      return out;
    }
  }
  return keys[keys.length - 1].slice(1, n + 1);
}

// ---------------------------------------------------------------------------

  ['#FF5F57', '#FEBC2E', '#28C840'].forEach((c) => { const d = h('div', 'dot'); d.style.background = c; chrome.appendChild(d); });
  const url = h('div', 'urlbar', `<svg width="20" height="24" viewBox="0 0 20 24"><rect x="2" y="10" width="16" height="12" rx="3" fill="#8C93A6"/><path d="M5.5 10 V7 a4.5 4.5 0 0 1 9 0 V10" stroke="#8C93A6" stroke-width="2.6" fill="none"/></svg><span class="txt"></span><span class="caret"></span>`);
  const rec = h('div', 'rec', '<span class="led"></span>실제 사이트');
  chrome.append(url, rec);
  const load = h('div', 'loadbar'); load.style.background = tl.color;
  const vp = h('div', 'viewport');
  const img = new Image(); img.src = `assets/sites/${tl.img}.jpg`; img.width = tl.W; img.height = tl.H;
  const blank = h('div', 'blank');
  vp.append(img, blank);
  const cursor = h('div', 'cursor', ARROW);
  const ripple = h('div', 'ripple'); ripple.style.borderColor = tl.color;
  br.append(chrome, load, vp, ripple, cursor);
  const desc = h('div', 'abs desc');
  const head = h('div', 'head', tl.head);
  head.querySelectorAll('em').forEach((e) => { e.style.background = tl.color; e.style.color = tl.color === C.yellow ? '#0A0E18' : '#fff'; e.style.borderRadius = '10px'; });
  const ul = h('ul');
  const lis = tl.bullets.map((b) => { const li = h('li', null, `<span class="tick">✓</span><span>${b}</span>`); li.querySelector('.tick').style.background = tl.color; ul.appendChild(li); return li; });
  desc.append(head, ul);
  s.append(num, cat, name, kname, free, br, desc);
  let note = null;
  if (tl.note) { note = h('div', 'abs note', tl.note); s.appendChild(note); }
  document.getElementById('tools').appendChild(s);
  return { s, num, cat, name, chars: [...name.children], kname, free, br, urlTxt: url.querySelector('.txt'), caret: url.querySelector('.caret'),
    load, img, blank, cursor, ripple, head, lis, note };
});

// intro
const intro = document.getElementById('intro');
const iWait = intro.querySelector('.wait');
'잠깐!'.split('').forEach((c) => iWait.appendChild(h('span', null, c)));
const iSub = intro.querySelector('.sub');
const iBig = intro.querySelector('.big .g');
const GWORD = [['구', C.blue], ['글', C.red], [' ', null], ['무', C.yellow], ['료', C.blue], [' ', null], ['A', C.green], ['I', C.red]];
const iBigChars = GWORD.map(([c, col]) => { const sp = h('span', null, c === ' ' ? '&nbsp;' : c); if (col) sp.style.color = col; iBig.appendChild(sp); return sp; });
const iSeven = intro.querySelector('.seven');
const iTiles = TOOLS.map((tl, i) => {
  const tile = h('div', 'abs tile', `<i>${tl.name[0]}</i>${tl.cat}`); tile.style.background = tl.color;
  intro.appendChild(tile); return tile;
});

// recap
const recap = document.getElementById('recap');
const rTitle = recap.querySelector('.title');
const rFoot = recap.querySelector('.foot');
const rRows = TOOLS.map((tl, i) => {
  const r = h('div', 'abs row', `<div class="n" style="background:${tl.color}">${i + 1}</div><div class="k">${tl.cat}</div><div class="arrow">→</div><div class="t">${tl.name}</div>`);
  r.style.top = (360 + i * 152) + 'px';
  recap.appendChild(r); return r;
});

// outro
const outro = document.getElementById('outro');
const oL1 = outro.querySelector('.l1'), oL2 = outro.querySelector('.l2'), oSmall = outro.querySelector('.small'), oBar = outro.querySelector('.gbar');
const OUT2 = [['무', C.blue], ['료', C.red], ['부', C.yellow], ['터', C.green], ['!', '#F4F1EA']];
const oChars = OUT2.map(([c, col]) => { const sp = h('span', null, c); sp.style.color = col; oL2.appendChild(sp); return sp; });

const glow = document.getElementById('glow'), grid = document.getElementById('grid');
const wipeBars = [...document.querySelectorAll('#wipe div')];
[C.blue, C.red, C.yellow, C.green].forEach((c, i) => { wipeBars[i].style.background = c; });

// ---------------------------------------------------------------------------
// render
// ---------------------------------------------------------------------------
function show(el, on) { el.style.display = on ? 'block' : 'none'; }

function renderBackground(t) {
  let col = '#4285F4';
  if (t >= T_TOOLS && t < T_RECAP) col = TOOLS[Math.min(6, Math.floor((t - T_TOOLS) / TOOL))].color;
  else if (t >= T_RECAP) col = ['#4285F4', '#34A853'][Math.floor(t / 2) % 2];
  glow.style.background = `radial-gradient(circle, ${col}66 0%, ${col}22 35%, transparent 65%)`;
  set(glow, { transform: `translate(${Math.sin(t * .5) * 60}px, ${Math.cos(t * .37) * 80}px)` });
  set(grid, { transform: `translateY(${(t * 18) % 40}px)` });
}

function renderProgress(t) {
  const on = t >= T_TOOLS - 0.2 && t < T_RECAP + 0.3;
  prog.style.opacity = on ? clamp(Math.min(seg(t, T_TOOLS - .2, T_TOOLS + .2), 1 - seg(t, T_RECAP, T_RECAP + .3))) : 0;
  fills.forEach((f, i) => { f.style.width = (clamp((t - T_TOOLS - i * TOOL) / TOOL) * 100) + '%'; });
}

// wipe: 4 diagonal Google-colour bars sweep across at each cut
const CUTS = [T_TOOLS, ...TOOLS.map((_, i) => T_TOOLS + (i + 1) * TOOL)];   // includes T_RECAP
function renderWipe(t) {
  let best = null;
  for (const c of CUTS) if (Math.abs(t - c) < 0.36) best = c;
  if (best == null) { wipeBars.forEach((b) => (b.style.display = 'none')); return; }
  const p = (t - best + 0.36) / 0.72;   // 0..1, cut at .5
  wipeBars.forEach((b, i) => {
    const d = i * 0.06;
    const pin = eInOut(clamp((p - d) / .5)), pout = eInOut(clamp((p - .5 - d * .5) / .45));
    const x = lerp(1500, 0, pin) + lerp(0, -1900, pout);
    set(b, { display: 'block', top: (-220 + i * 520) + 'px', transform: `translateX(${x}px) rotate(-14deg)` });
  });
}

function renderIntro(t) {
  // 잠깐! — on screen from frame 0, shakes, then flies up
  const out1 = eIn(seg(t, 1.05, 1.35));
  iWait.querySelectorAll('span').forEach((sp, i) => {
    const s = t < 0.02 ? 1.0 : pop(t, -0.08 + i * 0.07, 0.3);
    const shake = t < 1 ? Math.sin(t * 70 + i) * 5 * (1 - seg(t, .3, .9)) : 0;
    set(sp, { transform: `translate(${shake}px, ${-out1 * 500}px) scale(${Math.max(s, 0.001)}) rotate(${(i - 1) * 4 * (1 - seg(t, 0, .5))}deg)`, opacity: 1 - out1 });
  });
  const sIn = eOut(seg(t, 0.45, 0.75)), sOut = eIn(seg(t, 1.05, 1.3));
  set(iSub, { opacity: sIn * (1 - sOut), transform: `translateY(${(1 - sIn) * 60 - sOut * 400}px)` });

  // 구글 무료 AI + 7가지
  iBigChars.forEach((sp, i) => {
    const s = pop(t, 1.25 + i * 0.045, 0.3);
    set(sp, { transform: `translateY(${-310 + (1 - Math.min(s, 1)) * 80}px) scale(${Math.max(s, .001)})`, opacity: s > 0 ? 1 : 0 });
  });
  const s7 = pop(t, 1.6, 0.34);
  const exitP = eIn(seg(t, 3.05, 3.5));
  set(iSeven, { transform: `translateY(${-140}px) scale(${Math.max(s7, .001) * (1 + exitP * 3)}) rotate(${(1 - Math.min(1, s7)) * -25}deg)`, opacity: (s7 > 0 ? 1 : 0) * (1 - exitP) });
  set(iBig, { opacity: 1 - exitP });

  // seven tiles pop in a 4 + 3 grid under the 7
  iTiles.forEach((tile, i) => {
    const s = pop(t, 1.95 + i * 0.09, 0.3);
    const row = i < 4 ? 0 : 1, col = i < 4 ? i : i - 4;
    const x = (row === 0 ? 95 : 210) + col * 230, y = 1210 + row * 235;
    const fl = Math.sin(t * 3 + i) * 6;
    set(tile, { left: x + 'px', top: (y + fl + eIn(exitP) * 900) + 'px', transform: `scale(${Math.max(s, .001)}) rotate(${(i % 2 ? 6 : -6) * (1 - seg(t, 2.4, 3.0))}deg)`, opacity: s > 0 ? 1 - exitP : 0 });
  });
}

function camAt(tl, lt) {
  const [cx0, cy0, z] = keyed(tl.cam, lt, 3);
  const s = Math.max(VW / tl.W, VH / tl.H) * z;
  const hw = VW / 2 / s, hh = VH / 2 / s;
  const cx = clamp(cx0, hw, tl.W - hw), cy = clamp(cy0, hh, tl.H - hh);
  return { cx, cy, s };
}
const toScreen = (cam, x, y) => [(x - cam.cx) * cam.s + VW / 2, (y - cam.cy) * cam.s + VH / 2];

function renderTool(i, lt) {
  const tl = TOOLS[i], e = toolEls[i];
  // header
  const sn = pop(lt, TOOL_T.title, 0.3);
  set(e.num, { transform: `scale(${Math.max(sn, .001)}) rotate(${(1 - Math.min(sn, 1)) * -40}deg)` });
  e.chars.forEach((sp, k) => {
    const s = pop(lt, TOOL_T.title + 0.08 + k * 0.035, 0.27);
    const wig = lt > 1.5 ? Math.sin(lt * 4 + k * .7) * 2 : 0;
    set(sp, { transform: `translateY(${(1 - Math.min(s, 1)) * 40 + wig}px) scale(${Math.max(s, .001)})`, opacity: s > 0 ? 1 : 0 });
  });
  const pc = eOut(seg(lt, TOOL_T.title + .1, TOOL_T.title + .45));
  set(e.cat, { opacity: pc, transform: `translateX(${(1 - pc) * -40}px)` });
  const pk = eOut(seg(lt, TOOL_T.title + .3, TOOL_T.title + .7));
  set(e.kname, { opacity: pk * .95, transform: `translateY(${(1 - pk) * 20}px)` });

  // browser slides up
  const pb = eOut(seg(lt, 0.1, 0.6));
  set(e.br, { transform: `translateY(${(1 - pb) * 260}px) scale(${0.94 + 0.06 * pb})`, opacity: pb });

  // URL typing
  const full = tl.host + tl.path;
  const n = Math.round(full.length * seg(lt, TOOL_T.url0, TOOL_T.url1));
  const typed = full.slice(0, n);
  const hostPart = typed.slice(0, Math.min(n, tl.host.length)), pathPart = typed.slice(tl.host.length);
  e.urlTxt.innerHTML = `<span class="host">${hostPart}</span><span class="path">${pathPart}</span>`;
  e.caret.style.opacity = lt < TOOL_T.load1 && Math.floor(lt * 4) % 2 === 0 ? 1 : 0;
  const pl = seg(lt, TOOL_T.url1, TOOL_T.load1);
  set(e.load, { width: (eOut(pl) * 100) + '%', opacity: lt < TOOL_T.load1 + 0.15 ? (lt > TOOL_T.url1 ? 1 : 0) : 1 - seg(lt, TOOL_T.load1 + .15, TOOL_T.load1 + .35) });
  e.blank.style.opacity = 1 - eOut(seg(lt, TOOL_T.load1, TOOL_T.load1 + 0.25));

  // page camera
  const cam = camAt(tl, lt);
  set(e.img, { transform: `translate(${-cam.cx * cam.s + VW / 2}px, ${-cam.cy * cam.s + VH / 2}px) scale(${cam.s})` });

  // cursor: interpolate between screen positions fixed at each key's time
  const pts = tl.cur.map(([kt, x, y]) => [kt, ...toScreen(camAt(tl, kt), x, y)]);
  const [mx, my] = keyed(pts, lt, 2);
  let press = 0;
  for (const c of tl.clicks) press = Math.max(press, 1 - Math.abs(lt - c) / 0.09);
  set(e.cursor, { transform: `translate(${mx - 4}px, ${my + 80 - 3}px) scale(${1 - clamp(press) * 0.18})`, opacity: lt > TOOL_T.load1 ? eOut(seg(lt, TOOL_T.load1, TOOL_T.load1 + .2)) : 0 });
  let rip = null;
  for (const c of tl.clicks) if (lt >= c && lt < c + 0.5) rip = c;
  if (rip != null) {
    const p = seg(lt, rip, rip + 0.5);
    const [rx, ry] = keyed(pts, rip, 2);
    set(e.ripple, { left: rx + 'px', top: (ry + 80) + 'px', opacity: 1 - p, transform: `scale(${0.3 + eOut(p) * 1.2})` });
  } else e.ripple.style.opacity = 0;

  // description
  const ph = eOut(seg(lt, TOOL_T.head, TOOL_T.head + .4));
  set(e.head, { opacity: ph, transform: `translateY(${(1 - ph) * 50}px)` });
  [TOOL_T.b1, TOOL_T.b2].forEach((bt, k) => {
    const p = eOut(seg(lt, bt, bt + .35));
    set(e.lis[k], { opacity: p, transform: `translateX(${(1 - p) * -60}px)` });
  });
  const sf = pop(lt, TOOL_T.free, 0.3);
  set(e.free, { transform: `scale(${Math.max(sf, .001)}) rotate(${Math.sin(lt * 5) * 1.5 * (sf > 0 ? 1 : 0)}deg)`, opacity: sf > 0 ? 1 : 0 });
  if (e.note) e.note.style.opacity = eOut(seg(lt, 3.0, 3.4));
}

function renderRecap(lt) {
  const pt = pop(lt, 0.15, 0.3);
  set(rTitle, { transform: `scale(${Math.max(pt, .001)})`, opacity: pt > 0 ? 1 : 0 });
  rRows.forEach((r, i) => {
    const p = eOut(seg(lt, 0.55 + i * 0.32, 0.55 + i * 0.32 + 0.4));
    set(r, { opacity: p, transform: `translateX(${(1 - p) * 700}px)` });
  });
  const pf = pop(lt, 3.3, 0.3);
  set(rFoot, { transform: `scale(${Math.max(pf, .001)}) rotate(${Math.sin(lt * 4) * 1}deg)`, opacity: pf > 0 ? 1 : 0 });
}

function renderOutro(lt) {
  const p1 = eOut(seg(lt, 0.0, 0.35));
  set(oL1, { opacity: p1, transform: `translateY(${(1 - p1) * 60}px)` });
  oChars.forEach((sp, i) => {
    const s = pop(lt, 0.3 + i * 0.07, 0.3);
    set(sp, { transform: `translateY(${Math.sin(lt * 3 + i) * 6}px) scale(${Math.max(s, .001)})`, opacity: s > 0 ? 1 : 0 });
  });
  const pb = eOut(seg(lt, 0.8, 1.2));
  set(oBar, { transform: `scaleX(${pb})` });
  const ps = eOut(seg(lt, 1.1, 1.5));
  set(oSmall, { opacity: ps, transform: `translateY(${(1 - ps) * 20}px)` });
}

window.renderAt = async (t) => {
  renderBackground(t);
  renderProgress(t);
  renderWipe(t);
  show(intro, t < T_TOOLS);
  if (t < T_TOOLS) renderIntro(t);
  toolEls.forEach((e, i) => {
    const t0 = T_TOOLS + i * TOOL;
    const on = t >= t0 && t < t0 + TOOL;
    show(e.s, on);
    if (on) renderTool(i, t - t0);
  });
  show(recap, t >= T_RECAP && t < T_OUTRO);
  if (t >= T_RECAP && t < T_OUTRO) renderRecap(t - T_RECAP);
  show(outro, t >= T_OUTRO);
  if (t >= T_OUTRO) renderOutro(t - T_OUTRO);
};

// cue sheet for audio.py (absolute seconds)
window.CUES = (() => {
  const cues = { duration: DURATION, bpm: 120, whoosh: CUTS.slice(), pop: [], click: [], type: [], ding: [], tick: [], hit: [], boom: [], final: [] };
  cues.hit.push(0.0); cues.pop.push(0.5, 1.25); cues.boom.push(1.6);
  TOOLS.forEach((_, i) => cues.pop.push(1.95 + i * 0.09));
  TOOLS.forEach((tl, i) => {
    const t0 = T_TOOLS + i * TOOL;
    cues.pop.push(t0 + TOOL_T.title);
    const full = tl.host + tl.path;
    for (let k = 0; k < full.length; k += 2) cues.type.push(t0 + TOOL_T.url0 + (TOOL_T.url1 - TOOL_T.url0) * k / full.length);
    tl.clicks.forEach((c) => cues.click.push(t0 + c));
    cues.tick.push(t0 + TOOL_T.b1, t0 + TOOL_T.b2);
    cues.ding.push(t0 + TOOL_T.free);
  });
  cues.pop.push(T_RECAP + 0.15);
  TOOLS.forEach((_, i) => cues.tick.push(T_RECAP + 0.55 + i * 0.32));
  cues.ding.push(T_RECAP + 3.3);
  cues.pop.push(T_OUTRO + 0.3); cues.final.push(T_OUTRO + 0.3);
  return cues;
})();

const FONT_LOADS = ['40px BHSL', '40px BHSK', '500 40px Pretendard', '700 40px Pretendard', '800 40px Pretendard', '900 40px Pretendard']
  .map((f) => document.fonts.load(f, 'Aa가힣'));
Promise.all([...FONT_LOADS, document.fonts.ready, ...toolEls.map((e) => e.img.decode().catch(() => {}))]).then(async () => {
  const fit = (el, maxW) => { const fs = parseFloat(getComputedStyle(el).fontSize); if (el.scrollWidth > maxW) el.style.fontSize = Math.floor(fs * maxW / el.scrollWidth) + 'px'; };
  toolEls.forEach((e) => { e.s.style.display = 'block'; fit(e.name, 784); e.s.style.display = 'none'; });
  recap.style.display = 'block'; rRows.forEach((r) => fit(r.querySelector('.t'), 380)); recap.style.display = 'none';
  await window.renderAt(0);
  window.__ready = true;
});
</script>
